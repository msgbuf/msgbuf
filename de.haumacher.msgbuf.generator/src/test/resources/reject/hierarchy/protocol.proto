package reject.hierarchy.protocol;

option NoTypeKind;

/** Equal identifiers given explicitly. */
abstract message Shape { }

@Name("shape")
message Circle extends Shape { }

abstract message Polygon extends Shape { }

@Name("shape")
message Square extends Polygon { }

@XmlName("rect")
message Rect extends Polygon { }

@XmlName("rect")
message Box extends Polygon { }

@type_id(7)
message Line extends Shape { }

@type_id(7)
message Arc extends Shape { }

/** A concrete root carries no type information, equal type IDs do not matter. */
message Plain { }

@Name("x")
message Plain1 extends Plain { }

@Name("x")
message Plain2 extends Plain { }
